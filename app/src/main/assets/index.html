<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Chess</title>
<style>
  :root {
    --brass:      #d3a95f;
    --brass-dim:  rgba(211,169,95,.28);
    --ink:        #0d0c0b;
    --ink-2:      #17150f;
    --pale:       #efe7d6;
    --pale-dim:   rgba(239,231,214,.55);
    --danger:     #d1553f;
    --strip:      env(safe-area-inset-top, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    overflow: hidden; background: var(--ink);
    color: var(--pale);
    font: 400 15px/1.4 -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    overscroll-behavior: none; touch-action: none;
    user-select: none; -webkit-user-select: none;
  }

  /* stage fills the viewport; board is centred and as large as the short edge */
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(120% 90% at 50% 40%, #221d16 0%, #0d0c0b 70%);
  }
  #board { display: block; touch-action: none; }

  /* ---- strips ---------------------------------------------------------- */
  .strip {
    position: fixed; left: 0; right: 0;
    display: flex; align-items: center; gap: 10px;
    padding: 0 14px; z-index: 5; pointer-events: none;
  }
  .strip > * { pointer-events: auto; }
  #top    { top: 0;    padding-top: calc(env(safe-area-inset-top, 0px) + 10px); padding-bottom: 10px; }
  #bottom { bottom: 0; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); padding-top: 10px; }

  /* captured material */
  .taken { display: flex; align-items: center; flex-wrap: wrap; gap: 1px; min-height: 22px; flex: 1; }
  .taken canvas { display: block; margin-right: -6px; opacity: .82; }
  .edge { font: 600 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
          color: var(--brass); letter-spacing: .04em; padding-left: 6px; }

  /* status line */
  #status {
    text-align: center; font-size: 12px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--pale-dim);
    white-space: nowrap; font-weight: 600;
  }
  #status.check  { color: var(--danger); }
  #status.think  { color: var(--brass); }

  /* ---- buttons --------------------------------------------------------- */
  .bar { display: flex; gap: 8px; justify-content: center; width: 100%; }
  button {
    appearance: none; border: 1px solid rgba(239,231,214,.14);
    background: rgba(28,25,20,.72); backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    color: var(--pale); border-radius: 11px;
    padding: 9px 14px; font: 600 13px/1 inherit; letter-spacing: .02em;
    transition: transform .12s ease, background .12s ease, opacity .12s ease;
  }
  button:active { transform: scale(.94); background: rgba(211,169,95,.2); }
  button:disabled { opacity: .3; }
  button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

  /* ---- sheet ----------------------------------------------------------- */
  #scrim {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 10;
    opacity: 0; pointer-events: none; transition: opacity .2s ease;
    backdrop-filter: blur(2px);
  }
  #scrim.on { opacity: 1; pointer-events: auto; }
  #sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 11;
    background: rgba(20,18,14,.97); border-top: 1px solid rgba(211,169,95,.22);
    border-radius: 20px 20px 0 0;
    padding: 8px 18px calc(env(safe-area-inset-bottom, 0px) + 22px);
    transform: translateY(101%); transition: transform .26s cubic-bezier(.32,.72,.3,1);
    max-height: 82vh; overflow-y: auto;
  }
  #sheet.on { transform: translateY(0); }
  .grab { width: 38px; height: 4px; border-radius: 2px; background: rgba(239,231,214,.22);
          margin: 6px auto 14px; }
  .row { margin-bottom: 18px; }
  .row h3 {
    margin: 0 0 8px; font-size: 11px; font-weight: 700; letter-spacing: .18em;
    text-transform: uppercase; color: var(--brass);
  }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg button { flex: 1 1 auto; min-width: 58px; padding: 10px 8px; font-weight: 500; }
  .seg button.on { background: var(--brass); color: #17140d; border-color: var(--brass); font-weight: 700; }

  /* ---- promotion picker ------------------------------------------------ */
  #promo {
    position: fixed; inset: 0; z-index: 20; display: none;
    align-items: center; justify-content: center; background: rgba(0,0,0,.6);
    backdrop-filter: blur(3px);
  }
  #promo.on { display: flex; }
  #promo .card {
    background: rgba(22,20,15,.98); border: 1px solid rgba(211,169,95,.3);
    border-radius: 18px; padding: 16px; display: flex; gap: 6px;
  }
  #promo canvas { border-radius: 12px; background: rgba(211,169,95,.08); padding: 4px; }
  #promo canvas:active { background: rgba(211,169,95,.3); }

  /* ---- move list ------------------------------------------------------- */
  #moves {
    font: 400 13px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--pale-dim); max-height: 34vh; overflow-y: auto;
    background: rgba(0,0,0,.3); border-radius: 10px; padding: 10px 12px;
    white-space: pre-wrap; word-break: break-word;
  }

  /* landscape: move the chrome into the side gutters so nothing covers the board */
  body.lay-l #top, body.lay-l #bottom {
    top: 0; bottom: 0; width: var(--gutter, 140px);
    flex-direction: column; justify-content: center;
    padding: 18px 12px;
  }
  body.lay-l #top    { left: 0; right: auto; }
  body.lay-l #bottom { right: 0; left: auto; }
  body.lay-l .bar    { flex-direction: column; width: 100%; }
  body.lay-l .bar button { width: 100%; }
  body.lay-l .taken  { flex: 0 0 auto; justify-content: center; }
  body.lay-l #status { white-space: normal; text-align: center; }

  /* very tight screens: translucent bars that sit over the board edges */
  body.lay-c #top, body.lay-c #bottom {
    background: linear-gradient(to bottom, rgba(10,9,8,.86), rgba(10,9,8,.55));
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  body.lay-c #bottom { background: linear-gradient(to top, rgba(10,9,8,.86), rgba(10,9,8,.55)); }
  body.lay-c button { padding: 7px 11px; font-size: 12px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0s !important; }
  }
</style>
</head>
<body>

<div id="stage"><canvas id="board"></canvas></div>

<div class="strip" id="top">
  <div class="taken" id="takenByWhite"></div>
  <div id="status">Your move</div>
  <div class="edge" id="edgeTop"></div>
</div>

<div class="strip" id="bottom">
  <div class="bar">
    <button id="btnNew">New game</button>
    <button id="btnUndo">Undo</button>
    <button id="btnHint">Hint</button>
    <button id="btnMore" aria-label="Settings">Settings</button>
  </div>
</div>

<div id="promo"><div class="card"></div></div>

<div id="scrim"></div>
<div id="sheet">
  <div class="grab"></div>

  <div class="row">
    <h3>Difficulty</h3>
    <div class="seg" id="segLevel">
      <button data-v="1">Easy</button>
      <button data-v="2">Casual</button>
      <button data-v="3">Club</button>
      <button data-v="4">Strong</button>
      <button data-v="5">Hardest</button>
    </div>
  </div>

  <div class="row">
    <h3>Board &amp; pieces</h3>
    <div class="seg" id="segStyle">
      <button data-v="wood">Wood</button>
      <button data-v="marble">Marble</button>
      <button data-v="metal">Metal</button>
      <button data-v="grass">Grass</button>
    </div>
  </div>

  <div class="row">
    <h3>You play</h3>
    <div class="seg" id="segSide">
      <button data-v="w">White</button>
      <button data-v="b">Black</button>
      <button data-v="2">Two players</button>
    </div>
  </div>

  <div class="row">
    <h3>Board</h3>
    <div class="seg" id="segOpts">
      <button data-k="coords">Coordinates</button>
      <button data-k="dots">Move hints</button>
      <button data-k="arrow">Last-move arrow</button>
      <button data-k="sound">Sound</button>
    </div>
  </div>

  <div class="row">
    <h3>Moves</h3>
    <div id="moves">1.</div>
  </div>

  <div class="row">
    <div class="seg">
      <button id="btnFlip">Flip board</button>
      <button id="btnCopy">Copy PGN</button>
      <button id="btnClose">Done</button>
    </div>
  </div>
</div>

<script src="engine.js"></script>
<script src="pieces.js"></script>
<script src="ui.js"></script>
</body>
</html>
